# ============================================================
# tmux.conf
#   Server : Linux (over SSH)
#   Client : WezTerm on macOS
# ============================================================

# --- Prefix -------------------------------------------------
# Remap prefix from C-b to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- General ------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:RGB"     # True color (24-bit)
# Undercurl + colored underline (Neovim LSP diagnostics -> WezTerm)
set -ga terminal-overrides ",*:Smulx=\\E[4::%p1%dm"
set -ga terminal-overrides ",*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%d::%p3%d%;m"

set -g history-limit 100000
set -sg escape-time 0                           # No delay for ESC (vim friendly)
set -g focus-events on
set -g base-index 1                             # Windows start at 1
setw -g pane-base-index 1                       # Panes start at 1
set -g renumber-windows on                      # Renumber windows on close
set -g display-time 2000

# WezTerm inline image / graphics passthrough
set -g allow-passthrough on

# Keep SSH agent & connection vars fresh on reconnect
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION SSH_CLIENT DISPLAY"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- Mouse --------------------------------------------------
set -g mouse on

# --- Splitting (prefix + | / -) -----------------------------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Pane navigation ----------------------------------------
# wezterm-like: Alt + Arrow (no prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
# vim-like: prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane resize --------------------------------------------
# wezterm-like: Alt + Shift + Arrow (no prefix)
bind -n M-S-Left  resize-pane -L 3
bind -n M-S-Right resize-pane -R 3
bind -n M-S-Up    resize-pane -U 1
bind -n M-S-Down  resize-pane -D 1
# vim-like: prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 3
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 3

# --- Window switching (Shift + Arrow) -----------------------
bind -n S-Left  previous-window
bind -n S-Right next-window

# --- Clipboard / Copy mode ----------------------------------
# OSC 52 passthrough: tmux -> WezTerm -> macOS clipboard.
# No wl-copy/xclip/pbcopy here: those target the SSH server, not the client.
set -s set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# ============================================================
# Appearance (Dracula+ palette, matching .wezterm.lua)
# ============================================================
# bg=#282a36 current-line=#44475a fg=#f8f8f2 comment=#6272a4
# green=#50fa7b purple=#bd93f9

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#282a36,fg=#f8f8f2"

# Session name (left)
set -g status-left-length 40
set -g status-left "#[bg=#bd93f9,fg=#282a36,bold] #S #[default] "

# Date / time (right)
set -g status-right-length 80
set -g status-right "#[fg=#6272a4]%Y-%m-%d #[bg=#bd93f9,fg=#282a36,bold] %H:%M "

# Window list
setw -g window-status-current-style "bg=#44475a,fg=#50fa7b,bold"
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-style "fg=#6272a4"
setw -g window-status-format " #I:#W#F "

# Panes
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9,bold"

# Messages
set -g message-style "bg=#bd93f9,fg=#282a36,bold"
